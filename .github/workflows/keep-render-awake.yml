name: Wake Render services

on:
  schedule:
    # Every 20 minutes from 07:00 through 18:40 in America/Sao_Paulo (UTC-3).
    - cron: '*/20 10-21 * * *'
    # Final daily request at 19:00 in America/Sao_Paulo.
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: wake-render-services
  cancel-in-progress: true

jobs:
  ping-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake frontend and API during the campaign
        shell: bash
        run: |
          set -euo pipefail

          campaign_end='2026-09-07'
          today="$(TZ=America/Sao_Paulo date +%F)"

          if [[ "$today" > "$campaign_end" ]]; then
            echo "Keep-awake campaign ended on $campaign_end."
            exit 0
          fi

          for url in \
            'https://feiraco-web.onrender.com/' \
            'https://feiraco-api.onrender.com/api/v1/health'
          do
            echo "Waking $url"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 2 \
              --retry-delay 10 \
              --max-time 90 \
              "$url" \
              > /dev/null
          done
