name: Wake Render services

on:
  schedule:
    # Every 15 minutes from 09:00 through 18:45 in America/Sao_Paulo (UTC-3).
    - cron: '*/15 12-21 * * *'
    # Final daily request at 19:00 in America/Sao_Paulo.
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: wake-render-services
  cancel-in-progress: true

jobs:
  ping-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake frontend and API during the campaign
        shell: bash
        run: |
          set -euo pipefail


          for url in \
            'https://feiraco-web.onrender.com/' \
            'https://feiraco-api.onrender.com/api/v1/health'
          do
            echo "Waking $url"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 2 \
              --retry-delay 10 \
              --max-time 90 \
              "$url" \
              > /dev/null
          done
