services:
  - type: web
    name: feiraco-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @feiraco/web build
    startCommand: pnpm --filter @feiraco/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: 553597709232

  - type: web
    name: feiraco-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @feiraco/api build
    startCommand: pnpm --filter @feiraco/api migrate && pnpm --filter @feiraco/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
      - key: LEADS_EXPORT_TOKEN
        sync: false
